# DCViewer — self-contained assignment stack
# Requires the unzipped corpus folder in this directory (see README).

services:
  postgres:
    image: postgres:16
    container_name: dcviewer_postgres
    environment:
      POSTGRES_USER: gathergov
      POSTGRES_PASSWORD: gathergov
      POSTGRES_DB: gathergov
    ports:
      - "5434:5432"
    volumes:
      - dcviewer_pg:/var/lib/postgresql/data
      # Loads demo meetings/people/projects on first boot only (empty volume).
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gathergov -d gathergov"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: dcviewer_api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://gathergov:gathergov@postgres:5432/gathergov
      UPLOAD_DIR: /data/uploads
      CORPUS_PATH: /data/corpus
      MODEL_CONCURRENCY: "8"
    volumes:
      - dcviewer_uploads:/data/uploads
      - ./data_center_candidate_transcripts_2025-11-04_to_2026-11-04:/data/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dcviewer_frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dcviewer_pg:
  dcviewer_uploads:
